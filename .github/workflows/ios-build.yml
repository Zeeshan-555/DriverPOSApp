name: Build iOS App
on: [push]
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Create Web Assets
        run: mkdir -p www dist
      - name: Clean and Add iOS Platform
        run: |
          rm -rf ios
          npx cap add ios
      - name: Sync iOS and Plugins
        run: npx cap sync ios
      - name: Verify Podfile Exists
        run: |
          if [ -f "ios/App/Podfile" ]; then
            echo "Podfile found successfully!"
          else
            echo "Error: Podfile not found!"
            exit 1
          fi
      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install
      - name: Build iOS App via Xcode
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release clean build CODE_SIGNING_ALLOWED=NO