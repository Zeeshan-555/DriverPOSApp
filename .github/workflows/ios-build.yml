name: Build iOS App
on: [push]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Ensure Web Directory Exists
        run: mkdir -p www dist

      - name: Re-create and Sync iOS Platform
        run: |
          rm -rf ios
          npx cap add ios --packagemanager CocoaPods
          npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Build iOS App via Xcode
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release -derivedDataPath build clean build CODE_SIGNING_ALLOWED=NO

      - name: Build Payload and Export IPA
        run: |
          cd ios/App/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R App.app Payload/
          zip -r $GITHUB_WORKSPACE/DriverApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriverApp-IPA
          path: DriverApp.ipa