name: Build iOS App
on: [push]
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Create Web Assets
        run: mkdir -p www dist
      - name: Initialize Capacitor iOS
        run: npx cap init --force || true
      - name: Add iOS Platform Manually if Missing
        run: |
          npx cap add ios || true
          ls -la ios/App || true
      - name: Sync iOS
        run: npx cap sync ios
      - name: List Directory for Debugging
        run: ls -la ios/App || true
      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install
      - name: Build iOS App via Xcode
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release clean build CODE_SIGNING_ALLOWED=NO