<!DOCTYPE html>
<html lang="en">
<head>

  <title>Driver POS Launch</title>
  <style>
    body {

      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f6f9;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;

      max-width: 80%;

    .btn {
      display: inline-block;

      border-radius: 8px;

<body>

    <a id="openBtn" href="#" class="btn">Open Star WebPRNT</a>

  <script>
    // Aapka exact Oracle APEX POS URL
    var APP_URL = "https://g3abe3d28894d81-sf989trdzjk0jv8l.adb.uk-london-1.oraclecloudapps.com/ords/f?p=106";

    var SCHEME_URL = "webprnt://starmicronics.com/open?url=" + encodeURIComponent(APP_URL);
